# log-skimmer 示范项目集 (SSOT) — 防腐语料抓取源清单
# 来源: 跨栈知名开源项目 124 项 / 25 栈标签 (rust/go/ts/python/... 主流
#   fmt/lint/typecheck/test 工具族); 2026-10-21 全量核验 GHA 在场 + 最新
#   run 活性 (90 天窗口)。
# tools 为预期标签 (sweep per-rule 命中报告给真值); slots/max 为抓取策略;
#   既有 3 语料仓 (niri-wm/niri · anomalyco/opencode · nix-community/
#   home-manager) 槽位 14F+5S 覆盖 defaults (语料连续性), 其余 121 项走
#   defaults 8F+3S。
# exempt: 未适配过渡通道 — 该项目工具暂无覆盖规则, 抓取时 sidecar 记
#   gate_exempt=true, L0 门禁跳其 FN/FP 率/零块断言 (边界违例/语料在场/
#   压缩率双测不豁免, 语义见 dev 仓 spec §4); 规则适配达标后移出该字段
#   (豁免余量 = 适配进度度量)。
defaults:
  slots: {failure: 8, success: 3}
  max_job_log_bytes: 5242880  # 单 job 日志超限跳过并注记 (证据完整性优先, 不截断)
