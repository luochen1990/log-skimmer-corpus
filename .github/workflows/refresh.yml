# corpus-refresh — 语料仓自刷新 (GHA 全闭环, 零消费方流量)
#
# 职责: 滚动槽位重拉 (14F+5S per repo, fetch-logs 默认值) + 镜像引擎重算压缩率基线
#   + 单 commit 原子配对推送 (语料与基线同 commit 版本化)。
# 触发: weekly cron + engine-sync dispatch (消费方主仓引擎/规则变更后的即时基线跟进)。
# 判定器: 每次刷新从 GitHub mirror 主仓 (luochen1990/log-skimmer, forgejo push
#   mirror 自动同步) checkout 最新 master — 无镜像目录无同步机制, 判定器恒最新。
# secret: API_TOKEN = 经典 PAT (读公开仓 actions; 拉取空仓由 fetch-logs 硬断言拦截,
#   基线空窗由 gate --update-baseline 在场断言拦截 — 三层防线缺一不可)。
# 防线: FN/零块信号不在本仓判 (无规则门禁语义), 由主仓下一 PR 的 l0-gate 红暴露 —
#   倒逼规则集覆盖最新失败形态, 属滚动语料的设计价值。
name: corpus-refresh
on:
  schedule: [{cron: "0 20 * * 1"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: corpus-refresh, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # 本仓 (语料数据)
      - uses: actions/checkout@v4 # 判定器: mirror 主仓最新 master
        with: {repository: luochen1990/log-skimmer, path: main-repo}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: "main-repo"}
      - name: build engine
        run: cargo build --release -p log-skimmer
        working-directory: main-repo
      - name: slots refresh
        env:
          # 仓级 secret API_TOKEN (经典 PAT): per-run github.token 打不了跨仓 API
          # (对外部仓资源 401, 2026-10-16 空仓事故根源); PAT 读公开仓 actions 即可
          GITHUB_API_TOKEN: ${{ secrets.API_TOKEN }}
          CORPUS_DIR: ${{ github.workspace }}
        run: |
          rm -rf github.com
          bash main-repo/scripts/fetch-logs.sh
      - name: baseline recompute (collect → gate --update-baseline)
        env:
          CORPUS_DIR: ${{ github.workspace }}
        run: |
          LOG_SKIMMER_BIN="$PWD/main-repo/target/release/log-skimmer" bash main-repo/scripts/l0-collect.sh >/dev/null
          bash main-repo/scripts/l0-gate.sh --update-baseline
      - name: commit + push
        run: |
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "语料与基线无变化"
          else
            git commit -qm "corpus refresh $(date -u +%Y-%m-%dT%H:%MZ) [engine $(git log -1 --format=%h -- rules src scripts Cargo.toml)]"
            git push
          fi
