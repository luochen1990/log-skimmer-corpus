# corpus-refresh — 语料仓自刷 (纯槽位滚动; 源头自包含, 零外部仓依赖)
#
# 职责: 三仓 (sst/opencode · niri-wm/niri · nix-community/home-manager) 槽位
#   重拉 (14F+5S per repo, scripts/fetch-logs.sh 自带副本 — 演进随发布面同步,
#   源文件在 log-skimmer dev 仓) + 单 commit 推送。语料是源头材料, 不算基线
#   不构建引擎 (需求方裁决 2026-10-16 四仓拓扑: 基线退役, 压缩率防退化由消费方
#   dev 仓 CI 双测对比承担)。
# 防线: 任一仓 0 对在场 → fetch-logs 硬断言红 (拉取链路故障不得空仓收场)。
# secret: API_TOKEN = 经典 PAT (读三仓公开 actions; per-run github.token 跨仓 401)。
name: corpus-refresh
on:
  schedule: [{cron: "0 20 * * 1"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: corpus-refresh, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: slots refresh (14F+5S per repo)
        env:
          GITHUB_API_TOKEN: ${{ secrets.API_TOKEN }}
          CORPUS_DIR: ${{ github.workspace }}
        run: |
          rm -rf github.com
          bash scripts/fetch-logs.sh
      - name: commit + push
        run: |
          git config user.name "corpus-bot"
          git config user.email "corpus-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "语料无变化"
          else
            git commit -qm "corpus refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
